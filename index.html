<html>

<head>
    <title>New Tab</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>

<body>
    <div class="weather">
        <div class="weathersearch">
            <input id="city" type="text" placeholder="Enter city" />
            <button onclick="getWeather()" class="wthrbttn">Search</button>
        </div>
        <hr class="linebelowweather">
        <div id="weatherresult">
            <div class="temp">--°C</div>
        </div>
    </div>
    <div class="time">00:00</div>
    <div class="searchbar">
        <input type="text" placeholder="Search" onkeydown="search(event)">
    </div>
    <hr class="linebelowsearchbar">
    <div class="tiles">
        <a href="https://www.youtube.com" title="YouTube">
            <img src="https://www.youtube.com/favicon.ico" alt="YouTube">
        </a>
        <a href="https://www.netflix.com" title="Netflix">
            <img src="https://www.netflix.com/favicon.ico" alt="Netflix">
        </a>
        <a href="https://chatgpt.com" title="ChatGPT">
            <img src="https://chatgpt.com/favicon.ico" alt="ChatGPT">
        </a>
        <a href="https://github.com" title="GitHub">
            <img src="https://github.com/favicon.ico" alt="GitHub">
        </a>
        <a href="https://open.spotify.com" title="Spotify">
            <img src="https://open.spotify.com/favicon.ico" alt="Spotify">
        </a>
    </div>
</body>

</html>
